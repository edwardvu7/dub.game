# Builds the Windows installer on GitHub's own Windows machines, so nobody has to build it locally.
#
# - Push a version tag (git tag v0.1.0 && git push origin v0.1.0): builds the installer and
#   publishes it on the repo's Releases page, where anyone can download it.
# - Actions tab -> "Build Windows installer" -> "Run workflow": builds it and attaches it to that run
#   (download from the run page; needs a GitHub login).
name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to publish the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Attach to this run
        uses: actions/upload-artifact@v4
        with:
          name: dub.game-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
