<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src blob:; base-uri 'none'; form-action 'none'">
  <title>dubplay overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="overlay">
  <aside class="panel" aria-label="Voice settings">
    <div class="panel-grip" aria-hidden="true"></div>
    <div class="panel-scroll">
      <div id="cards-host"></div>
    </div>
    <p class="panel-error" id="overlay-error" role="alert" hidden></p>
  </aside>

  <script src="fake-dub.js"></script>
  <script src="lib.js"></script>
  <script src="cards.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
